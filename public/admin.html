<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Restaurant admin | Awl Lahza</title><link rel="icon" type="image/svg+xml" href="/assets/favicon-round.svg?v=1"><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/source.css"><link rel="stylesheet" href="/styles.css"><script type="module" src="/admin.js"></script><script src="/loading.js" defer></script></head>
<body data-title="admin"><header class="compact-header"><a class="brand-link" href="/"><img src="/assets/brand-logo.svg" alt="Awl Lahza / أول لحظة"><span data-i18n="brand">Awl Lahza</span></a><div class="compact-actions"><a href="/" class="text-link" data-i18n="menu">Menu</a><div class="lsw"><button class="lb" data-lang="en" lang="en">EN</button><button class="lb" data-lang="ar" lang="ar">عربي</button></div></div></header>
<main class="admin-main"><section id="login-panel" class="panel login-panel"><h1 data-i18n="admin">Restaurant admin</h1><form id="login-form"><label><span data-i18n="username">Username</span><input name="username" autocomplete="username" maxlength="80" required></label><label><span data-i18n="password">Password</span><input name="password" type="password" autocomplete="current-password" maxlength="200" required></label><div id="login-error" class="notice error" role="alert" hidden></div><button type="submit" class="primary wide" data-i18n="login">Sign in</button></form></section>
<section id="admin-panel" hidden><div class="admin-nav"><button class="secondary on" data-view="orders" data-i18n="orders">Orders</button><button class="secondary" data-view="products" data-i18n="products">Menu settings</button><button class="text-link" id="logout" data-i18n="logout">Sign out</button></div><div id="admin-notice" role="alert" class="notice error" hidden></div><section id="admin-alerts" class="panel admin-alerts" aria-label="Notifications"></section><div id="admin-content"></div></section></main>
<dialog id="product-dialog" aria-labelledby="product-heading"><div class="dialog-heading"><h2 id="product-heading" data-i18n="editProduct">Edit product</h2><button type="button" class="icon-button" data-close aria-label="Close">×</button></div><form id="product-form"><div id="product-fields"></div><div id="product-error" role="alert" class="notice error" hidden></div><button type="submit" class="primary wide" data-i18n="save">Save changes</button></form></dialog></body></html>
